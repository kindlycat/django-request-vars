name: Linter

on:
  - push
  - pull_request

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Ruff check
        uses: astral-sh/ruff-action@v4
        with:
          version: 0.17.3

      - name: Ruff format
        uses: astral-sh/ruff-action@v4
        with:
          version: 0.17.3
          args: 'format --check'

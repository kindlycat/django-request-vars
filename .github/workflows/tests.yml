name: Tests

on:
  - push
  - pull_request

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.11 / Django 5.2
            python-version: "3.11"
            django-version: ">=5.2,<5.3"

          - name: Python 3.12 / Django 5.2
            python-version: "3.12"
            django-version: ">=5.2,<5.3"

          - name: Python 3.13 / Django 5.2
            python-version: "3.13"
            django-version: ">=5.2,<5.3"

          - name: Python 3.14 / Django 5.2
            python-version: "3.14"
            django-version: ">=5.2,<5.3"

          - name: Python 3.12 / Django 6.0
            python-version: "3.12"
            django-version: ">=6.0,<6.1"

          - name: Python 3.13 / Django 6.0
            python-version: "3.13"
            django-version: ">=6.0,<6.1"

          - name: Python 3.14 / Django 6.0
            python-version: "3.14"
            django-version: ">=6.0,<6.1"

          - name: Python 3.12 / Django 6.1
            python-version: "3.12"
            django-version: ">=6.1,<6.2"

          - name: Python 3.13 / Django 6.1
            python-version: "3.13"
            django-version: ">=6.1,<6.2"

          - name: Python 3.14 / Django 6.1
            python-version: "3.14"
            django-version: ">=6.1,<6.2"

          - name: Python 3.15 / Django 6.1
            python-version: "3.15"
            django-version: ">=6.1,<6.2"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: Sync project dependencies
        run: uv sync --frozen

      - name: Install pinned Django version
        run: uv pip install "Django${{ matrix.django-version }}"

      - name: Run tests
        run: uv run --no-sync pytest --cov --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

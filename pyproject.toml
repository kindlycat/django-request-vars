[project]
name = "django-request-vars"
dynamic = ["version"]
description = "Stores current request, user and your defined data in thread local variable."
authors = [
    {name = "Grigory Mishchenko", email = "grishkokot@gmail.com"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.rst"
keywords = ["django", "thread", "variable", "request", "user", "cache", "middleware"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dependencies = [
    "Django>=5.2",
]

[tool.hatch.version]
path = "request_vars/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["request_vars"]

[project.urls]
Homepage = "https://github.com/kindlycat/django-request-vars"
Documentation = "https://django-request-vars.readthedocs.io"
Repository = "https://github.com/kindlycat/django-request-vars.git"
Issues = "https://github.com/kindlycat/django-request-vars/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-django",
    "pytest-cov",
    "jinja2",
    "ipython>=8.35.0",
    "ipdb>=0.13.13",
    "ruff>=0.17.3",
    "coverage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "docs",
]

line-length = 79
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100", "D101", "D102", "EXE001", "D107", "ANN003", "ANN001",
    "ARG002", "ANN002", "D103", "D106", "D104", "ANN201", "COM812", "ISC001",
    "ANN401", "TRY003", "EM102", "EM101", "PLR0913", "D105", "CPY001"
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "RUF012", "D105", "PLR2004", "S105", "S701"]

[tool.ruff.lint.isort]
section-order = [
    "future", "standard-library", "third-party", "first-party", "local-folder"
]
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage.run]
source = ["request_vars"]
omit = ["*/management/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]
